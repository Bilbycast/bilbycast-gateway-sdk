name: CI

# Nothing built this crate on a PR — no build, no test, no clippy, no CI of
# any kind — and it is a library with out-of-tree consumers, so a source-
# breaking change here is felt in repos this workflow cannot see.
#
# That is not hypothetical. Adding `allow_plaintext_ws` to `GatewayConfig`
# (a struct with all-public fields, no `#[non_exhaustive]` and no `Default`)
# broke both in-repo consumers with E0063 and shipped anyway, because the only
# automation that would have noticed is `nightly-release.yml` in
# bilbycast-appear-x-api-gateway — which runs on tag push, i.e. after the tag
# is already on origin.
#
# The consumer job below is the load-bearing half: it builds
# bilbycast-appear-x-api-gateway against THIS checkout of the SDK, so a
# source-breaking change fails here rather than in somebody else's release.
# The consumer path-depends on `../bilbycast-gateway-sdk`, so the checkout
# layout has to put the SDK in a sibling directory of it.
#
# The second consumer, bilbycast-gateway-template, is covered by its own CI
# rather than here — see the comment on the `consumers` job for why a public
# repo must not check out a private one.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check + test + clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo test
        run: cargo test --all-targets

      # `-D warnings` matches the gate in bilbycast-edge and
      # bilbycast-manager. The crate was clippy-clean when this landed; keep
      # it that way rather than letting debt accumulate behind no gate.
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  consumers:
    name: consumers build against this SDK
    runs-on: ubuntu-24.04
    # Only the PUBLIC consumer is built here, and that is a deliberate limit,
    # not an oversight.
    #
    # `GatewayConfig` has two exhaustive-literal consumers —
    # bilbycast-appear-x-api-gateway (public) and bilbycast-gateway-template
    # (private). This repo is public, so `actions/checkout` with the default
    # GITHUB_TOKEN cannot read the private one: the first run failed here with
    # "Not Found", which is how GitHub reports "no access" for a private repo.
    #
    # The fix is NOT to hand this job a PAT. Workflow logs on a public repo are
    # publicly readable, and a compile error prints the offending source lines —
    # so checking a private repo out here would publish private source to
    # anyone who opens the run. The template's half of the guard lives in the
    # template's own repo instead (private -> public is free, no secret), which
    # gives the same protection from the other side.
    #
    # Coverage is not lost for the class this job exists to catch: appear-x
    # builds the same exhaustive `GatewayConfig` literal, so a new required
    # field fails right here.
    strategy:
      fail-fast: false
      matrix:
        consumer:
          - bilbycast-appear-x-api-gateway
    steps:
      # Both consumers path-depend on `../bilbycast-gateway-sdk`, so lay the
      # tree out as `work/<consumer>` + `work/bilbycast-gateway-sdk`.
      - name: Checkout ${{ matrix.consumer }}
        uses: actions/checkout@v7
        with:
          repository: Bilbycast/${{ matrix.consumer }}
          path: ${{ matrix.consumer }}

      - name: Checkout this SDK as the sibling path dependency
        uses: actions/checkout@v7
        with:
          path: bilbycast-gateway-sdk

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.consumer }}

      # NOT `--locked`: the consumer's committed Cargo.lock pins the SDK by
      # path, and a dependency change in this PR legitimately moves it. The
      # point of this job is the source-compatibility check, not lockfile
      # drift.
      - name: cargo check ${{ matrix.consumer }}
        working-directory: ${{ matrix.consumer }}
        run: cargo check --all-targets
