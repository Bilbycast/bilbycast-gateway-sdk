[package]
name = "bilbycast-gateway-sdk"
version = "0.10.1"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "SDK for building 3rd-party device gateway sidecars that integrate with bilbycast-manager"
publish = false

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
rustls = "0.23.43"
webpki-roots = "1.0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = "1.0.104"
async-trait = "0.1.92"
tokio-util = { version = "0.7.19", features = ["rt"] }
tokio-stream = "0.1.19"
futures-util = "0.3.34"
thiserror = "2.0.20"
url = "2.5.8"
bytes = "1.12.1"
sha2 = "0.11.0"
hex = "0.4.3"
toml = "1.1.4"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
base64 = "0.23.1"

# ── Remote upgrade plumbing (mirror of bilbycast-edge/src/upgrade/) ──────
# Parameterised by `(repo, binary_name, install_root, allowed_signers)`
# so every gateway sidecar inherits self-upgrade support without
# duplicating the Sigstore + atomic-symlink-swap machinery. See
# `src/upgrade/mod.rs` for the public surface.
tar = "0.4"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
semver = { version = "1.0", features = ["serde"] }
fs2 = "0.4"
sigstore = { version = "0.14", default-features = false, features = ["sigstore-trust-root", "cached-client"] }
# HELD at 0.2 deliberately — x509-cert 0.3.0 is out, but sigstore 0.14 (the
# latest) still requires ^0.2. Bumping ours alone resolves BOTH into the graph,
# putting a second X.509 parser in the release-signature verification path for
# no functional gain (we only need `Certificate::from_der` + extension access,
# and we hand sigstore raw SPKI/signature bytes, never a shared type). Move
# this in lockstep with sigstore, not ahead of it.
x509-cert = { version = "0.2", default-features = false, features = ["std"] }

[dev-dependencies]
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tempfile = "3.27.0"
